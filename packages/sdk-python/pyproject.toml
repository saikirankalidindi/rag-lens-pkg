[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name ="raglens-sdk"
version = "0.1.1"
description = "Lightweight tracing for RAG pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "twine"]

[tool.setuptools.packages.find]
include = ["raglens*"]

[project.urls]
    Homepage = "https://github.com/saikirankalidindi/RAGLens"
    Documentation = "https://github.com/saikirankalidindi/RAGLens/blob/main/docs/QUICKSTART.md"
    Repository = "https://github.com/saikirankalidindi/RAGLens"
