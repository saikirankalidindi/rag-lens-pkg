services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raglens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raglens}
      POSTGRES_DB: ${POSTGRES_DB:-raglens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raglens} -d ${POSTGRES_DB:-raglens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API (FastAPI) ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-raglens}:${POSTGRES_PASSWORD:-raglens}@db:5432/${POSTGRES_DB:-raglens}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-raglens}:${POSTGRES_PASSWORD:-raglens}@db:5432/${POSTGRES_DB:-raglens}
      SECRET_KEY: ${SECRET_KEY:-changeme-use-a-real-secret-in-production-min-32-chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MAX_TRACE_PAYLOAD_BYTES: ${MAX_TRACE_PAYLOAD_BYTES:-5242880}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Web (Next.js) ───────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
