[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raglens-api"
version = "0.1.0"
description = "RAGLens API — observability backend for RAG pipelines"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",

    # Validation & settings
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",

    # Database
    "sqlalchemy[asyncio]==2.0.31",
    "alembic==1.13.2",
    "asyncpg==0.29.0",        # async PostgreSQL driver
    "psycopg2-binary==2.9.9", # sync driver used by Alembic only

    # Security
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1", # compatible with passlib 1.7.4
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",  # required for OAuth2 form parsing

    # Utilities
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "httpx==0.27.0",
    "pytest-cov==5.0.0",
    "ruff==0.5.0",
    "mypy==1.10.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
